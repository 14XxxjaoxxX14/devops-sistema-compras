name: Pipeline CI - DevOps POC

# Dispara a automação sempre que houver um push ou pull request na branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia o código do seu repositório para a máquina virtual na nuvem
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    # 2. Configura a versão do Python no ambiente do GitHub
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Instala o Flask definido no seu requirements.txt
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Executa a sua suíte de testes unitários
    - name: Executar Testes Unitários
      run: |
        pytest
        python -m unittest test_sistema_compras.py
        